name: Terraform CI/CD

on:
  push:
    branches: [main]

env:
  TF_VERSION: 1.9.0
  GCP_REGION: us-central1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}
      
      - uses: google-github-actions/setup-gcloud@v1
      
      - run: gcloud config set project fintech-dev-001
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - run: cd terraform && terraform init -backend-config="bucket=fintech-terraform-state-dev"
      - run: cd terraform && terraform fmt -check -recursive
      - run: cd terraform && terraform validate

  deploy-dev:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}
      
      - uses: google-github-actions/setup-gcloud@v1
      
      - run: gcloud config set project fintech-dev-001
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - run: |
          cd terraform
          terraform init -backend-config="bucket=fintech-terraform-state-dev"
          terraform plan -var-file=environments/dev.tfvars -out=tfplan-dev
          terraform apply tfplan-dev
      
      - run: |
          cd terraform
          terraform output -raw environment >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output -raw project_id >> $GITHUB_STEP_SUMMARY
