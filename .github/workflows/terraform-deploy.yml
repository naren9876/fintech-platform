name: Terraform CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'

env:
  TF_VERSION: 1.9.0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
        working-directory: terraform

      - run: terraform init -backend=false
        working-directory: terraform

      - run: terraform validate
        working-directory: terraform

  deploy-dev:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/832393411011/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@fintech-dev-001.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=fintech-terraform-state-dev"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
