apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-api
  namespace: default
  labels:
    app: fintech-api
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fintech-api
  template:
    metadata:
      labels:
        app: fintech-api
        environment: dev
    spec:
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Equal
        value: "true"
        effect: NoSchedule
      
      containers:
      - name: fintech-api
        image: gcr.io/fintech-dev-001/fintech-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        
        envFrom:
        - configMapRef:
            name: fintech-api-config
        - secretRef:
            name: fintech-api-secrets
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
